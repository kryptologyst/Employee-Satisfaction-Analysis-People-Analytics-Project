# Sentiment Analysis Configuration
model:
  name: "sentiment_analyzer"
  type: "ensemble"  # ensemble, transformer, traditional
  
# Traditional NLP models
traditional:
  textblob:
    enabled: true
    thresholds:
      positive: 0.2
      negative: -0.2
  vader:
    enabled: true
    thresholds:
      positive: 0.05
      negative: -0.05

# Transformer models
transformer:
  model_name: "cardiffnlp/twitter-roberta-base-sentiment-latest"
  batch_size: 32
  max_length: 512
  device: "auto"  # auto, cpu, cuda

# Ensemble settings
ensemble:
  weights:
    textblob: 0.3
    vader: 0.3
    transformer: 0.4
  voting: "soft"  # soft, hard

# Data processing
preprocessing:
  remove_urls: true
  remove_mentions: true
  remove_hashtags: false
  lowercase: true
  remove_punctuation: false
  min_length: 3
  max_length: 1000

# Evaluation
evaluation:
  metrics:
    - accuracy
    - f1_macro
    - f1_weighted
    - precision_macro
    - recall_macro
    - auroc
    - auprc
  cross_validation:
    enabled: true
    folds: 5
    stratify: true

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/sentiment_analysis.log"
